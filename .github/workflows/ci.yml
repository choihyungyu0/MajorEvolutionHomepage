name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# 같은 브랜치에 새 커밋이 오면 진행 중인 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # scripts/tests의 흐름 테스트 7종. 환경변수 없이 동작한다.
      - name: Test
        run: npm test

      # .env.local 없이 빌드되는지 확인한다. 비밀값이 빌드 조건이 되면 여기서 깨진다.
      - name: Build
        run: npm run build
